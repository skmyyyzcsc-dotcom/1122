<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>维护中 · 丸子九号</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f6f5f2; color: #1b1b1b; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    text-align: center; padding: 48px 40px; max-width: 480px; width: 90%;
    background: #fff; border: 1px solid #e6e4dd; border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.06);
  }
  .mark {
    width: 56px; height: 56px; border-radius: 14px; background: #1b1b1b; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: "Noto Serif SC", Georgia, serif; font-size: 24px; font-weight: 700;
    margin: 0 auto 20px;
  }
  .icon { font-size: 40px; margin-bottom: 12px; line-height: 1; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: .06em; margin-bottom: 10px; }
  p { font-size: 14px; color: #78776f; line-height: 1.8; }
  .time { margin-top: 18px; padding-top: 16px; border-top: 1px dashed #e6e4dd; font-size: 12px; color: #a6a59d; }
  .foot { margin-top: 14px; font-size: 11px; color: #a6a59d; letter-spacing: .12em; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .dot { display: inline-block; animation: pulse 1.6s ease infinite; }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">丸</div>
    <div class="icon">🛠️</div>
    <h1>站点维护中</h1>
    <p>我们正在进行模板升级与内容更新<br>敬请期待<span class="dot">。</span><span class="dot">。</span><span class="dot">。</span></p>
    <div class="time">预计恢复时间：<b style="color:#1b1b1b">维护完成后立即恢复</b></div>
    <div class="foot">WANZI NO.9 · 丸子九号</div>
  </div>
</body>
</html>
