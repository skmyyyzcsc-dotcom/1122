<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>58mm 吧唧编辑器 · 丸子九号</title>
<style>
  @font-face {
    font-family: 'BukhariScript';
    src: url('./BukhariScript.ttf') format('truetype');
  }
  @font-face {
    font-family: 'Modak';
    src: url('./Modak-Regular.ttf') format('truetype');
  }
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --ink: #1b1b1b;
    --ink-2: #78776f; --ink-3: #a6a59d; --line: #e6e4dd;
    --accent: #6c5ce7; --accent-soft: #efecfc; --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.6;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
    display: flex; flex-direction: column;
  }
  .serif { font-family: "Noto Serif SC", Georgia, "Times New Roman", serif; }

  .ed-topbar { position: sticky; top: 0; z-index: 50; background: rgba(246,245,242,.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .ed-topbar-inner { max-width: 1280px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ed-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); cursor: pointer; }
  .ed-brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
  .ed-brand b { font-size: 15px; font-weight: 650; letter-spacing: .08em; }
  .ed-brand small { font-size: 10px; color: var(--ink-3); letter-spacing: .18em; display: block; text-transform: uppercase; }
  .ed-btn { padding: 9px 20px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all .2s; font-family: inherit; }
  .ed-btn:hover { border-color: var(--ink); }
  .ed-btn-primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .ed-btn-primary:hover { background: #000; transform: translateY(-1px); }
  .ed-actions { display: flex; gap: 10px; align-items: center; }
  .ed-workspace { max-width: 1280px; width: 100%; height: calc(100vh - 59px); margin: 0 auto; padding: 24px; display: flex; gap: 24px; align-items: stretch; overflow: hidden; }
  .ed-panel { flex: 0 0 340px; min-height: 0; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  .ed-panel-title { font-size: 14px; font-weight: 650; letter-spacing: .05em; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .ed-field { margin-bottom: 14px; }
  .ed-field.editor-target { outline: 2px solid rgba(108,92,231,.35); outline-offset: 4px; border-radius: 8px; }
  .ed-field label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
  .ed-field input[type="text"], .ed-field input[type="number"] { width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; outline: none; font-family: inherit; }
  .ed-field input:focus { border-color: var(--accent); }
  .ed-field input[type="range"] { width: 100%; accent-color: var(--accent); }
  .ed-field select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; outline: none; font-family: inherit; background: #fff; }
  .ed-row { display: flex; gap: 8px; }
  .ed-row > div { flex: 1; }
  .ed-position-control { display: grid; grid-template-columns: repeat(3, 32px); grid-template-rows: repeat(3, 28px); gap: 3px; justify-content: center; margin-top: 6px; }
  .ed-position-control button { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; font: 16px/1 inherit; padding: 0; }
  .ed-position-control button:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .ed-position-control button:active { transform: scale(.94); }
  .ed-position-control .position-up { grid-column: 2; grid-row: 1; }
  .ed-position-control .position-left { grid-column: 1; grid-row: 2; }
  .ed-position-control .position-readout { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--ink-2); font-size: 9px; line-height: 1.25; }
  .ed-position-control .position-right { grid-column: 3; grid-row: 2; }
  .ed-position-control .position-down { grid-column: 2; grid-row: 3; }
  .ed-upload-box { border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; cursor: pointer; transition: all .2s; margin-bottom: 12px; }
  .ed-upload-box:hover { border-color: var(--accent); background: var(--accent-soft); }
  .ed-upload-box .u-icon { font-size: 22px; margin-bottom: 6px; }
  .ed-upload-box p { font-size: 12px; color: var(--ink-2); }
  .ed-upload-box small { font-size: 11px; color: var(--ink-3); }
  .ed-color-control { display: flex; align-items: center; gap: 10px; }
  .ed-color-control input[type="color"] { width: 42px; height: 30px; padding: 2px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); cursor: pointer; }
  .ed-color-value { font-size: 12px; color: var(--ink-2); text-transform: uppercase; }
  .ed-photo-thumb { width: 56px; height: 56px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: #faf9f6; flex: none; }
  .ed-photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .ed-thumb-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .ed-thumb-row span { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ed-hint { font-size: 11.5px; color: var(--ink-3); line-height: 1.7; margin-top: 6px; }
  .ed-divider { height: 1px; background: var(--line); margin: 16px 0; }
  .ed-preview-panel { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 10px 0; }
  .ed-preview-toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin: 0 12px 8px; color: var(--ink-2); font-size: 12px; }
  .ed-preview-toolbar button { width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--ink); cursor: pointer; font: 16px/1 inherit; }
  .ed-preview-toolbar #preview-zoom-reset { width: 48px; padding: 0 8px; font-size: 12px; white-space: nowrap; }
  .ed-preview-toolbar button:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .ed-preview-toolbar button:active { transform: scale(.94); }
  .ed-preview-zoom-value { min-width: 42px; text-align: center; }
  .ed-preview-scroll { position: relative; width: 100%; height: 100%; overflow: auto; padding: 0; }
  .ed-canvas-stage { position: relative; flex: none; margin: 0; }
  #ed-canvas-wrap { transform-origin: top left; box-shadow: 0 10px 40px rgba(0,0,0,.18); border-radius: 6px; overflow: hidden; }
  #ed-canvas { position: relative; background: #fff; }
  #ed-canvas .bg-img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; pointer-events: none; }
  .ed-text-layer { position: absolute; color: #d88f9a; line-height: 1.15; white-space: pre; cursor: grab; outline: none; z-index: 2; transform-origin: center; user-select: none; -webkit-user-drag: none; }
  .ed-text-layer.selected { outline: 1px dashed rgba(108,92,231,.9); outline-offset: 3px; }
  .ed-text-layer.dragging { cursor: grabbing; }
  .ed-text-layer.editing { cursor: text; box-shadow: 0 0 0 1.5px rgba(108,92,231,.6); border-radius: 2px; }
  #ed-canvas .ed-img-layer { cursor: move; }
  #ed-canvas .ed-img-layer img { display: block; width: 100%; height: 100%; object-fit: fill; pointer-events: none; user-select: none; -webkit-user-drag: none; }
  #ed-canvas .badge-preview { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; user-select: none; -webkit-user-drag: none; }

  @media (max-width: 860px) {
    .ed-workspace { height: auto; flex-direction: column-reverse; overflow: visible; }
    .ed-panel { flex: none; width: 100%; overflow: visible; }
    .ed-preview-panel { min-height: auto; }
    .ed-preview-scroll { height: auto; }
  }
  @media (max-width: 600px) {
    body { overflow-x: hidden; }
    .ed-topbar-inner { padding: 10px 14px; align-items: flex-start; }
    .ed-brand { min-width: 0; gap: 8px; }
    .ed-brand-mark { width: 32px; height: 32px; flex: none; }
    .ed-brand b { display: block; max-width: 145px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
    .ed-brand small { font-size: 8px; letter-spacing: .12em; }
    .ed-actions { flex-wrap: wrap; justify-content: flex-end; gap: 5px; max-width: 190px; }
    .ed-actions .ed-btn { padding: 7px 9px; font-size: 11px; }
    .ed-workspace { padding: 14px; gap: 14px; }
    .ed-panel { padding: 14px; border-radius: 12px; }
    .ed-preview-panel { width: 100%; padding: 0; }
    .ed-preview-toolbar { margin: 0 0 8px; gap: 5px; }
    .ed-preview-scroll { min-height: 0; }
  }

</style>
</head>
<body>
<div class="ed-topbar">
  <div class="ed-topbar-inner">
    <div class="ed-brand" onclick="goBack()">
      <span class="ed-brand-mark serif">丸</span>
      <span><b id="ed-title">← 58mm 吧唧 · 蓝色甜点</b><small>BADGE EDITOR · WANZI NO.9 · 848×848</small></span>
    </div>
    <div class="ed-actions">
      <button class="ed-btn" id="btn-undo" onclick="undo()" disabled aria-label="上一步" title="上一步">上一步</button>
      <button class="ed-btn" id="btn-redo" onclick="redo()" disabled aria-label="下一步" title="下一步">下一步</button>
      <button class="ed-btn" onclick="resetTexts()">重置</button>
      <button class="ed-btn ed-btn-primary" onclick="exportPng()">导出 PNG</button>
    </div>
  </div>
</div>
<div class="ed-workspace">
  <aside class="ed-panel">
    <div class="ed-panel-title" id="ed-panel-title">编辑内容 · 58mm 吧唧</div>
    <div id="ed-form"></div>
  </aside>
  <div class="ed-preview-panel">
    <div class="ed-preview-toolbar" aria-label="模板预览缩放">
      <button type="button" onclick="zoom(-10)" aria-label="缩小模板" title="缩小模板">−</button>
      <span class="ed-preview-zoom-value" id="zoom-label">90%</span>
      <button type="button" onclick="zoom(10)" aria-label="放大模板" title="放大模板">+</button>
      <button type="button" onclick="zoomTo(100)" id="preview-zoom-reset" aria-label="恢复模板大小" title="恢复模板大小">复位</button>
    </div>
    <div class="ed-preview-scroll" id="ed-preview-scroll">
      <div class="ed-canvas-stage" id="ed-canvas-stage">
        <div id="ed-canvas-wrap">
          <div id="ed-canvas"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<input type="file" id="img-file" accept="image/*" hidden onchange="addImage(this)">

    { id: "sub", label: "副文字", left: 154, top: 547, width: 80, height: 26, fontSize: 18, font: "Modak", color: "#ffffff", value: "1016" }
  ]
};

const FONT_CSS = {
  BukhariScript: "'BukhariScript', 'Brush Script MT', cursive",
  Modak: "'Modak', 'Arial Black', sans-serif",
  NotoSerif: "'Noto Serif SC', serif",
  DancingScript: "'Dancing Script', cursive"
};
const FONT_OPTIONS = [
  { id: "BukhariScript", label: "Bukhari Script" },
  { id: "Modak", label: "Modak" },
  { id: "DancingScript", label: "Dancing Script" },
  { id: "NotoSerif", label: "衬线体" }
];

let currentTpl = BADGE_TEMPLATE;
let selectedTextId = null;
let previewZoom = 0.9;
let historyStack = [];
let historyIndex = -1;
let imageSeq = 0;

// ========== 历史记录 ==========
function snapshot() {
  return JSON.parse(JSON.stringify({ texts: currentTpl.texts, images: currentTpl.images || [] }));
}
function recordHistory() {
  const s = snapshot();
  historyStack = historyStack.slice(0, historyIndex + 1);
  historyStack.push(s);
  historyIndex = historyStack.length - 1;
  if (historyStack.length > 40) { historyStack.shift(); historyIndex--; }
  updateHistoryButtons();
}
function updateHistoryButtons() {
  const u = document.getElementById("btn-undo"); if (u) u.disabled = historyIndex <= 0;
  const r = document.getElementById("btn-redo"); if (r) r.disabled = historyIndex >= historyStack.length - 1;
}
function restore(s) {
  currentTpl.texts = JSON.parse(JSON.stringify(s.texts));
  currentTpl.images = JSON.parse(JSON.stringify(s.images || []));
  renderEditor();
  renderPanel();
  updateHistoryButtons();
}
function undo() { if (historyIndex > 0) { historyIndex--; restore(historyStack[historyIndex]); } }
function redo() { if (historyIndex < historyStack.length - 1) { historyIndex++; restore(historyStack[historyIndex]); } }

// ========== 渲染 ==========
function applyPreviewZoom() {
  const wrap = document.getElementById("ed-canvas-wrap");
  wrap.style.transform = `scale(${previewZoom})`;
  wrap.style.marginRight = `-${currentTpl.width * (1 - previewZoom)}px`;
  wrap.style.marginBottom = `-${currentTpl.height * (1 - previewZoom)}px`;
  document.getElementById("zoom-label").textContent = Math.round(previewZoom * 100) + "%";
}
function zoom(d) { previewZoom = Math.min(2, Math.max(0.2, previewZoom + d / 100)); applyPreviewZoom(); }
function zoomTo(v) { previewZoom = v / 100; applyPreviewZoom(); }

function renderEditor() {
  const canvas = document.getElementById("ed-canvas");
  canvas.style.width = currentTpl.width + "px";
  canvas.style.height = currentTpl.height + "px";
  canvas.innerHTML = "";

  const bg = document.createElement("img");
  bg.className = "bg-img";
  bg.src = currentTpl.bgData || currentTpl.bg;
  bg.draggable = false;
  canvas.appendChild(bg);

  (currentTpl.images || []).forEach(im => {
    const el = document.createElement("div");
    el.className = "ed-text-layer ed-img-layer";
    el.id = "layer-" + im.id;
    el.dataset.textId = im.id;
    el.style.cssText = `left:${im.left}px;top:${im.top}px;width:${im.width}px;height:${im.height}px;${im.angle ? `transform:rotate(${im.angle}deg);` : ""}`;
    const pic = document.createElement("img");
    pic.src = im.src;
    pic.draggable = false;
    el.appendChild(pic);
    el.addEventListener("pointerdown", e => selectText(im.id, e));
    canvas.appendChild(el);
  });

  currentTpl.texts.forEach(t => {
    const el = document.createElement("div");
    el.className = "ed-text-layer";
    el.id = "layer-" + t.id;
    el.dataset.textId = t.id;
    t.height = t.height || Math.max(40, Math.ceil(t.fontSize * 2.3));
    let style = `left:${t.left}px;top:${t.top}px;width:${t.width}px;height:${t.height}px;font-size:${t.fontSize}px;font-family:${FONT_CSS[t.font] || FONT_CSS.NotoSerif};`;
    if (t.color) style += `color:${t.color};`;
    el.style.cssText = style;
    el.textContent = t.value.replace(/\\n/g, "\n");
    el.addEventListener("pointerdown", e => selectText(t.id, e));
    canvas.appendChild(el);
  });

  // 吧唧形状预览层（最上层，仅预览圆形裁切，导出时不绘制）
  const pv = document.createElement("img");
  pv.className = "badge-preview";
  pv.src = currentTpl.previewBg || "./58mm模板预览.png";
  pv.draggable = false;
  canvas.appendChild(pv);

  applyPreviewZoom();
}

// ========== 选中与拖动 ==========
function findLayer(id) {
  return currentTpl.texts.find(x => x.id === id) || (currentTpl.images || []).find(x => x.id === id);
}
function selectText(id, ev) {
  selectedTextId = id;
  document.querySelectorAll(".ed-text-layer").forEach(el => el.classList.toggle("selected", el.dataset.textId === id));
  renderPanel();
  if (!ev) return;
  const el = document.getElementById("layer-" + id);
  const rect = el.getBoundingClientRect();
  const scale = previewZoom;
  const startX = ev.clientX, startY = ev.clientY;
  const origLeft = findLayer(id).left;
  const origTop = findLayer(id).top;
  let moved = false;
  el.classList.add("dragging");

  function onMove(e) {
    const dx = (e.clientX - startX) / scale;
    const dy = (e.clientY - startY) / scale;
    const t = findLayer(id);
    t.left = Math.round(origLeft + dx);
    t.top = Math.round(origTop + dy);
    el.style.left = t.left + "px";
    el.style.top = t.top + "px";
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) moved = true;
    syncPanelPos(id);
  }
  function onUp() {
    el.classList.remove("dragging");
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    if (moved) recordHistory();
  }
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
}

// ========== 编辑面板 ==========
function renderPanel() {
  const form = document.getElementById("ed-form");
  form.innerHTML = "";
  renderPhotoBlock(form);
  currentTpl.texts.forEach(t => {
    const field = document.createElement("div");
    field.className = "ed-field" + (t.id === selectedTextId ? " editor-target" : "");
    field.innerHTML = `
      <label>${t.label} <span style="color:var(--ink-3);font-weight:400">（可拖拽移动）</span></label>
      <input type="text" value="${escapeHtml(t.value)}" onchange="updateText('${t.id}','value',this.value)">
      <div class="ed-row" style="margin-top:6px">
        <div>
          <label>字体</label>
          <select onchange="updateText('${t.id}','font',this.value)">
            ${FONT_OPTIONS.map(f => `<option value="${f.id}" ${f.id === t.font ? "selected" : ""}>${f.label}</option>`).join("")}
          </select>
        </div>
        <div>
          <label>字号 <b id="fsz-val-${t.id}" style="color:var(--accent)">${t.fontSize}px</b></label>
          <input type="range" min="10" max="140" value="${t.fontSize}" oninput="updateText('${t.id}','fontSize',+this.value); document.getElementById('fsz-val-${t.id}').textContent=this.value+'px'">
        </div>
      </div>
      <div class="ed-row" style="margin-top:6px">
        <div>
          <label>宽度 <b id="wdt-val-${t.id}" style="color:var(--accent)">${t.width}px</b></label>
          <input type="range" min="40" max="${currentTpl.width}" value="${t.width}" oninput="updateText('${t.id}','width',+this.value); document.getElementById('wdt-val-${t.id}').textContent=this.value+'px'">
        </div>
        <div>
          <label>颜色</label>
          <div class="ed-color-control">
            <input type="color" value="${t.color}" onchange="updateText('${t.id}','color',this.value); this.nextElementSibling.textContent=this.value">
            <span class="ed-color-value">${t.color}</span>
          </div>
        </div>
      </div>
      <label style="margin-top:8px">位置微调（每次1px）</label>
      <div class="ed-position-control">
        <button class="position-up" onclick="nudge('${t.id}',0,-1)">↑</button>
        <button class="position-left" onclick="nudge('${t.id}',-1,0)">←</button>
        <span class="position-readout" id="pos-${t.id}">X${t.left}<br>Y${t.top}</span>
        <button class="position-right" onclick="nudge('${t.id}',1,0)">→</button>
        <button class="position-down" onclick="nudge('${t.id}',0,1)">↓</button>
      </div>
    `;
    form.appendChild(field);
  });
}

function renderPhotoBlock(form) {
  const im = (currentTpl.images || [])[0];
  const div = document.createElement("div");
  div.innerHTML = `
    <div class="ed-field">
      <label>照片（自动进入模板照片区，可拖动/缩放/旋转构图）</label>
      <div class="ed-upload-box" onclick="document.getElementById('img-file').click()">
        <div class="u-icon">🖼</div>
        <p>${im ? "点击更换照片 / 插画" : "点击上传照片 / 插画"}</p>
        <small>${im ? "已上传，可在画布上拖动 / 缩放 / 旋转" : "照片将铺满吧唧画布，圆形模板区即为成品范围"}</small>
      </div>
      ${im ? `
        <div class="ed-thumb-row">
          <div class="ed-photo-thumb"><img src="${im.src}" alt=""></div>
          <span>${im.width} × ${im.height}px</span>
        </div>
        <label>照片缩放 <b id="p-scale-val" style="color:var(--accent)">${im.scale}%</b></label>
        <input type="range" min="50" max="300" value="${im.scale}" oninput="updateImage('${im.id}','scale',+this.value); document.getElementById('p-scale-val').textContent=this.value+'%'">
        <label style="margin-top:10px">照片旋转 <b id="p-rot-val" style="color:var(--accent)">${im.angle || 0}°</b></label>
        <input type="range" min="0" max="360" value="${im.angle || 0}" oninput="updateImage('${im.id}','angle',+this.value); document.getElementById('p-rot-val').textContent=this.value+'°'">
        <div style="text-align:right;margin-top:8px">
          <button class="ed-btn" style="padding:6px 14px;font-size:12px" onclick="removeImage('${im.id}')">移除照片</button>
        </div>
      ` : ""}
    </div>
    <div class="ed-divider"></div>
  `;
  form.appendChild(div);
}
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function updateText(id, key, val) {
  const t = currentTpl.texts.find(x => x.id === id);
  if (!t) return;
  t[key] = val;
  if (key === "value") {
    const el = document.getElementById("layer-" + id);
    if (el) el.textContent = val.replace(/\\n/g, "\n");
  } else if (key === "font") {
    const el = document.getElementById("layer-" + id);
    if (el) el.style.fontFamily = FONT_CSS[val] || FONT_CSS.NotoSerif;
  } else if (key === "fontSize") {
    const el = document.getElementById("layer-" + id);
    if (el) el.style.fontSize = val + "px";
  } else if (key === "width") {
    const el = document.getElementById("layer-" + id);
    if (el) el.style.width = val + "px";
  } else if (key === "color") {
    const el = document.getElementById("layer-" + id);
    if (el) el.style.color = val;
  }
  recordHistory();
}
function syncPanelPos(id) {
  const t = findLayer(id);
  const el = document.getElementById("pos-" + id);
  if (el && t) el.innerHTML = `X${t.left}<br>Y${t.top}`;
}
function nudge(id, dx, dy) {
  const t = findLayer(id);
  if (!t) return;
  t.left += dx; t.top += dy;
  const el = document.getElementById("layer-" + id);
  if (el) { el.style.left = t.left + "px"; el.style.top = t.top + "px"; }
  syncPanelPos(id);
  recordHistory();
}

// ========== 照片 ==========
function addImage(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const src = e.target.result;
    const probe = new Image();
    probe.onload = () => {
      const baseW = Math.min(420, probe.width);
      const ratio = probe.height / probe.width;
      const id = "img-" + (++imageSeq);
      const im = {
        id: id,
        label: "照片",
        left: Math.round((currentTpl.width - baseW) / 2),
        top: Math.round((currentTpl.height - baseW * ratio) / 2),
        baseWidth: baseW,
        ratio: ratio,
        scale: 100,
        angle: 0,
        width: baseW,
        height: Math.round(baseW * ratio),
        src: src
      };
      currentTpl.images = [im];
      selectedTextId = id;
      renderEditor();
      renderPanel();
      recordHistory();
    };
    probe.src = src;
  };
  reader.readAsDataURL(file);
  input.value = "";
}
function updateImage(id, key, val) {
  const im = (currentTpl.images || []).find(x => x.id === id);
  if (!im) return;
  if (key === "scale") {
    im.scale = +val;
    im.width = Math.round(im.baseWidth * im.scale / 100);
    im.height = Math.round(im.width * im.ratio);
  } else if (key === "angle") {
    im.angle = +val;
  }
  const el = document.getElementById("layer-" + id);
  if (el) { el.style.width = im.width + "px"; el.style.height = im.height + "px"; el.style.transform = im.angle ? `rotate(${im.angle}deg)` : ""; }
  recordHistory();
}
function removeImage(id) {
  currentTpl.images = (currentTpl.images || []).filter(x => x.id !== id);
  if (selectedTextId === id) selectedTextId = null;
  renderEditor();
  renderPanel();
  recordHistory();
}
function resetTexts() {
  currentTpl.texts = JSON.parse(JSON.stringify(BADGE_TEMPLATE.texts));
  currentTpl.images = [];
  renderEditor();
  renderPanel();
  recordHistory();
}

// ========== 导出 ==========
async function exportPng() {
  const canvas = document.createElement("canvas");
  canvas.width = currentTpl.width; canvas.height = currentTpl.height;
  const ctx = canvas.getContext("2d");
  const img = new Image();
  img.src = currentTpl.bgData || currentTpl.bg;
  await img.decode();
  ctx.drawImage(img, 0, 0, currentTpl.width, currentTpl.height);
  for (const im of currentTpl.images || []) {
    const pi = new Image();
    pi.src = im.src;
    await pi.decode();
    ctx.save();
    const cx = im.left + im.width / 2;
    const cy = im.top + im.height / 2;
    if (im.angle) ctx.translate(cx, cy), ctx.rotate(im.angle * Math.PI / 180), ctx.translate(-cx, -cy);
    ctx.drawImage(pi, im.left, im.top, im.width, im.height);
    ctx.restore();
  }
  await document.fonts.ready;
  currentTpl.texts.forEach(t => {
    const family = FONT_CSS[t.font] || FONT_CSS.NotoSerif;
    ctx.font = `${t.fontSize}px ${family}`;
    ctx.fillStyle = t.color;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    const lines = String(t.value).split("\n");
    lines.forEach((line, i) => {
      ctx.fillText(line, t.left, t.top + i * Math.ceil(t.fontSize * 1.25));
    });
  });
  const a = document.createElement("a");
  a.download = "吧唧_58mm_" + Date.now() + ".png";
  a.href = canvas.toDataURL("image/png");
  a.click();
}

// ========== 返回 ==========
function goBack() {
  if (window.parent !== window.self) {
    window.parent.postMessage({ type: "spring-editor-back" }, "*");
    return;
  }
  location.href = "index.html（主页面·模板库+iframe嵌入）.html";
}

// ========== 初始化 ==========
renderEditor();
renderPanel();
recordHistory();

  // ===== 移动端适配：画布自适应屏幕宽度 =====
  function fitMobileCanvas() {
    if (window.innerWidth <= 860) {
      const w = (typeof currentTpl !== "undefined" && currentTpl.width) || 848;
      const avail = window.innerWidth - 28;
      previewZoom = Math.max(0.2, Math.min(1, avail / w));
      applyPreviewZoom();
    }
  }
  fitMobileCanvas();
  window.addEventListener("resize", fitMobileCanvas);
</script>
